name: build-zImage

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 90

    steps:
      - name: 安装构建依赖
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential bison flex bc libncurses5-dev git python3 \
            gcc-arm-linux-gnueabi ca-certificates curl
          echo "--- 工具链 ---"
          gcc --version | head -1
          arm-linux-gnueabi-gcc --version | head -1

      - uses: actions/checkout@v4

      - name: 拉取内核源码
        run: |
          git clone --depth 1 --single-branch --branch kk4.4.2_1.0.0-ga \
            https://github.com/GT-System/linux-2.6-imx.git /kernel
          cd /kernel
          git config core.autocrlf false
          git log --oneline -1

      - name: 打补丁并校验
        run: |
          cd /kernel
          git apply "$GITHUB_WORKSPACE/0001-iap2-ncm.patch"
          echo "--- android.c 引入 ---"
          grep -n 'f_ncm.c\|f_iap2.c' drivers/usb/gadget/android.c
          echo "--- f_ncm.c 残留 __initdata（应为 0）---"
          grep -c '__initdata' drivers/usb/gadget/f_ncm.c || true
          echo "--- f_iap2.c ---"
          wc -l drivers/usb/gadget/f_iap2.c

      - name: 编译内核
        run: |
          KERNEL_DIR=/kernel \
          CONFIG_SRC="$GITHUB_WORKSPACE/build.config" \
          OUT_DIR=/out \
          bash "$GITHUB_WORKSPACE/build-kernel.sh"

      - name: 生成校验信息
        run: |
          cd /out
          md5sum zImage > zImage.md5
          ls -la
          cat zImage.md5

      - name: 上传为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zImage
          path: |
            /out/zImage
            /out/zImage.md5
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release（公开直链，无需登录即可下载）
        run: |
          set -e
          TAG="kernel-$(date +%Y%m%d-%H%M%S)"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          echo "创建 release $TAG"
          RESP=$(curl -sSL -X POST "$API/releases" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"i.MX6DL Linux 3.0.35 + CDC-NCM + iAP2\"}")
          RID=$(printf '%s' "$RESP" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("id",""))')
          if [ -z "$RID" ]; then echo "release 创建失败: $RESP"; exit 0; fi

          for f in zImage zImage.md5; do
            echo "上传 $f"
            curl -sSL -X POST \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RID}/assets?name=${f}" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@/out/${f}" > /dev/null
          done

          echo "=================================================="
          echo "下载地址（公开，无需登录）:"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/zImage"
          echo "=================================================="
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
