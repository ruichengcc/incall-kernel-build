name: build-zImage

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 关键：Linux 3.0.35 只支持到 gcc 4.x。
    # gcc 5+ 改了 inline asm 的寄存器分配，会触发 arch/arm 里 __asmeq 的
    # ".err encountered"（div64.h / uaccess.h，全内核高频使用）。
    # 16.04 自带 gcc-arm-linux-gnueabi 4.9.3，正好落在支持范围内。
    container: ubuntu:16.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}

    steps:
      - name: 准备 apt 源与依赖
        run: |
          set -e
          # 16.04 已 EOL，主源搬到了 old-releases
          sed -i 's/archive.ubuntu.com/old-releases.ubuntu.com/g; s/security.ubuntu.com/old-releases.ubuntu.com/g' /etc/apt/sources.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential bison flex bc libncurses5-dev git curl \
            ca-certificates python3 gcc-arm-linux-gnueabi
          echo "=================== 工具链 ==================="
          gcc --version | head -1
          arm-linux-gnueabi-gcc --version | head -1
          echo "============================================="
          # 断言编译器主版本，避免悄悄换成新版
          GV=$(arm-linux-gnueabi-gcc -dumpversion | cut -d. -f1)
          echo "交叉编译器主版本 = $GV"
          if [ "$GV" -ge 5 ]; then
            echo "!! 交叉编译器是 gcc $GV，本内核需要 4.x，继续跑大概率失败"
          fi

      - name: 取仓库内容
        run: |
          set -e
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" /repo
          cd /repo
          git log --oneline -1
          ls -la

      - name: 拉内核源码并打补丁
        run: |
          set -e
          git clone --depth 1 --single-branch --branch kk4.4.2_1.0.0-ga \
            https://github.com/GT-System/linux-2.6-imx.git /kernel
          cd /kernel
          git config core.autocrlf false
          git log --oneline -1
          git apply /repo/0001-iap2-ncm.patch
          echo "--- android.c 引入 ---"
          grep -n 'f_ncm.c\|f_iap2.c' drivers/usb/gadget/android.c
          echo "--- f_ncm.c 残留 __initdata（应为 0）---"
          grep -c '__initdata' drivers/usb/gadget/f_ncm.c || true
          echo "--- f_iap2.c ---"
          wc -l drivers/usb/gadget/f_iap2.c

      - name: 编译内核
        run: |
          set -e
          KERNEL_DIR=/kernel \
          CONFIG_SRC=/repo/build.config \
          OUT_DIR=/out \
          CROSS_COMPILE=arm-linux-gnueabi- \
          bash /repo/build-kernel.sh

      - name: 发布 Release
        run: |
          set -e
          cd /out
          md5sum zImage > zImage.md5
          ls -la
          cat zImage.md5

          TAG="kernel-$(date +%Y%m%d-%H%M%S)"
          API="https://api.github.com/repos/${REPO}"
          echo "创建 release ${TAG}"
          RESP=$(curl -sSL -X POST "$API/releases" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"i.MX6DL 3.0.35 + CDC-NCM + iAP2\"}")
          RID=$(printf '%s' "$RESP" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("id",""))' 2>/dev/null || true)
          if [ -z "$RID" ]; then
            echo "release 创建失败，响应："
            printf '%s\n' "$RESP"
            exit 1
          fi

          for f in zImage zImage.md5; do
            echo "上传 $f"
            curl -sSL -X POST \
              "https://uploads.github.com/repos/${REPO}/releases/${RID}/assets?name=${f}" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"/out/${f}" > /dev/null
          done

          echo "=================================================="
          echo "下载地址（公开，无需登录）:"
          echo "https://github.com/${REPO}/releases/download/${TAG}/zImage"
          echo "=================================================="
